<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir — Toko Rukun</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EE;
    --surface:#FFFFFF;
    --ink:#21281F;
    --green:#2F6F4E;
    --green-dark:#1F4D36;
    --green-pale:#E7F0EA;
    --amber:#C9622A;
    --amber-pale:#F7E7DB;
    --line:#DDD6C4;
    --muted:#8C8674;
    --danger:#B23A3A;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--amber-pale);}

  .app{
    max-width:1180px;
    margin:0 auto;
    padding:22px 20px 60px;
  }

  /* ---------- Header ---------- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand h1{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .brand .tag{
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:20px;
    padding:2px 9px;
  }
  .clock{
    font-size:12px;
    color:var(--muted);
    text-align:right;
  }

  nav.tabs{
    display:flex;
    gap:4px;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    font-family:inherit;
    font-size:13px;
    background:none;
    border:none;
    padding:9px 16px;
    cursor:pointer;
    color:var(--muted);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    transition:color .15s;
  }
  nav.tabs button:hover{color:var(--ink);}
  nav.tabs button.active{
    color:var(--ink);
    border-bottom-color:var(--green);
    font-weight:600;
  }

  .hidden{display:none !important;}

  /* ---------- Kasir layout ---------- */
  .pos-grid{
    display:grid;
    grid-template-columns:1fr 340px;
    gap:20px;
    align-items:start;
  }
  @media (max-width:820px){
    .pos-grid{grid-template-columns:1fr;}
  }

  .panel{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }

  .catalog-controls{
    display:flex;
    gap:8px;
    padding:14px;
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .search-input{
    flex:1;
    min-width:140px;
    font-family:inherit;
    font-size:13px;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  .search-input:focus{outline:2px solid var(--green); outline-offset:-1px;}
  .chip-row{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .chip{
    font-family:inherit;
    font-size:12px;
    padding:6px 12px;
    border:1px solid var(--line);
    background:var(--paper);
    color:var(--muted);
    border-radius:20px;
    cursor:pointer;
  }
  .chip.active{
    background:var(--green);
    border-color:var(--green);
    color:#fff;
  }

  .product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:10px;
    padding:14px;
    max-height:560px;
    overflow-y:auto;
  }
  .product-card{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px;
    cursor:pointer;
    background:var(--paper);
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color .12s, transform .08s;
  }
  .product-card:hover{border-color:var(--green);}
  .product-card:active{transform:scale(0.98);}
  .product-card.oos{
    opacity:0.45;
    cursor:not-allowed;
  }
  .product-card .pname{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:14.5px;
    line-height:1.25;
  }
  .product-card .pcat{
    font-size:10.5px;
    color:var(--muted);
  }
  .product-card .pprice{
    font-weight:600;
    color:var(--green-dark);
    font-size:13.5px;
    margin-top:auto;
  }
  .product-card .pstock{
    font-size:10.5px;
    color:var(--muted);
  }
  .empty-note{
    padding:30px 14px;
    text-align:center;
    color:var(--muted);
    font-size:13px;
  }

  /* ---------- Order / cart panel ---------- */
  .order-panel{
    display:flex;
    flex-direction:column;
    position:sticky;
    top:20px;
  }
  .order-head{
    padding:14px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .order-head h2{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:0;
    font-weight:600;
  }
  .order-head button{
    font-family:inherit;
    font-size:11px;
    color:var(--muted);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
  }
  .order-items{
    max-height:280px;
    overflow-y:auto;
    padding:6px 14px;
  }
  .order-line{
    display:grid;
    grid-template-columns:1fr auto;
    gap:6px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .order-line:last-child{border-bottom:none;}
  .ol-name{font-size:12.5px;}
  .ol-unit{font-size:11px; color:var(--muted);}
  .ol-qty-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:4px;
  }
  .qty-btn{
    width:20px;height:20px;
    border:1px solid var(--line);
    background:var(--paper);
    border-radius:var(--radius);
    cursor:pointer;
    font-size:12px;
    line-height:1;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);
  }
  .qty-btn:hover{border-color:var(--green);}
  .qty-val{font-size:12.5px; min-width:18px; text-align:center;}
  .ol-remove{
    font-size:10.5px;
    color:var(--danger);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .ol-linetotal{
    font-size:13px;
    font-weight:600;
    text-align:right;
    white-space:nowrap;
  }

  .order-empty{
    padding:34px 14px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  .order-summary{
    padding:14px;
    border-top:1px solid var(--line);
  }
  .sum-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    margin-bottom:6px;
  }
  .sum-row.total{
    font-size:17px;
    font-weight:700;
    margin-top:8px;
    padding-top:10px;
    border-top:2px solid var(--ink);
  }
  .cash-row{
    margin-top:12px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cash-row label{
    font-size:11px;
    color:var(--muted);
  }
  .cash-row input{
    font-family:inherit;
    font-size:14px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  .quick-cash{
    display:flex;
    gap:5px;
    flex-wrap:wrap;
    margin-top:2px;
  }
  .quick-cash button{
    font-family:inherit;
    font-size:11px;
    padding:5px 9px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--surface);
    cursor:pointer;
    color:var(--ink);
  }
  .quick-cash button:hover{border-color:var(--green);}

  .pay-btn{
    width:100%;
    margin-top:14px;
    padding:13px;
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.02em;
    background:var(--green);
    color:#fff;
    border:none;
    border-radius:var(--radius);
    cursor:pointer;
  }
  .pay-btn:hover{background:var(--green-dark);}
  .pay-btn:disabled{
    background:var(--line);
    color:var(--muted);
    cursor:not-allowed;
  }

  /* ---------- Produk tab ---------- */
  .produk-wrap{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:20px;
    align-items:start;
  }
  @media (max-width:820px){
    .produk-wrap{grid-template-columns:1fr;}
  }
  .form-panel{padding:16px;}
  .form-panel h2{
    font-family:'Fraunces', serif;
    font-size:16px;
    margin:0 0 14px;
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:4px;
  }
  .field input, .field select{
    width:100%;
    font-family:inherit;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--green); outline-offset:-1px;}
  .form-actions{
    display:flex;
    gap:8px;
    margin-top:16px;
  }
  .btn-primary, .btn-secondary{
    font-family:inherit;
    font-size:12.5px;
    padding:9px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    border:1px solid transparent;
  }
  .btn-primary{
    background:var(--green);
    color:#fff;
    flex:1;
  }
  .btn-primary:hover{background:var(--green-dark);}
  .btn-secondary{
    background:var(--surface);
    border-color:var(--line);
    color:var(--ink);
  }
  .btn-secondary:hover{border-color:var(--muted);}

  table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  thead th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--muted);
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    font-weight:500;
  }
  tbody td{
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tbody tr:hover{background:var(--paper);}
  .stock-low{color:var(--danger); font-weight:600;}
  .row-actions{display:flex; gap:10px;}
  .row-actions button{
    font-family:inherit;
    font-size:11px;
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    color:var(--green-dark);
    padding:0;
  }
  .row-actions button.del{color:var(--danger);}

  /* ---------- Riwayat tab ---------- */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:18px;
  }
  @media (max-width:600px){.stats-row{grid-template-columns:1fr;}}
  .stat-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
  }
  .stat-card .label{
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .stat-card .value{
    font-family:'Fraunces', serif;
    font-size:22px;
    font-weight:700;
  }

  .history-list{padding:6px 0;}
  .history-row{
    display:grid;
    grid-template-columns:110px 1fr auto auto;
    gap:12px;
    align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .history-row:hover{background:var(--paper);}
  @media (max-width:600px){
    .history-row{grid-template-columns:1fr; gap:2px;}
  }
  .history-row .h-time{font-size:11px; color:var(--muted);}
  .history-row .h-items{font-size:12.5px;}
  .history-row .h-total{font-weight:700; font-size:13.5px;}
  .history-row .h-id{font-size:10.5px; color:var(--muted);}

  /* ---------- Modal / receipt ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(33,40,31,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .receipt{
    background:#fff;
    width:100%;
    max-width:320px;
    max-height:88vh;
    overflow-y:auto;
    border-radius:var(--radius);
    padding:22px 20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.2);
  }
  .receipt-head{
    text-align:center;
    border-bottom:1px dashed var(--ink);
    padding-bottom:12px;
    margin-bottom:12px;
  }
  .receipt-head .rname{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:17px;
  }
  .receipt-head .rmeta{
    font-size:10.5px;
    color:var(--muted);
    margin-top:4px;
  }
  .receipt-line{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:3px;
  }
  .receipt-item-name{font-size:12px;}
  .receipt-item-sub{font-size:10.5px; color:var(--muted);}
  .receipt-divider{
    border-top:1px dashed var(--ink);
    margin:10px 0;
  }
  .receipt-total-row{
    display:flex;
    justify-content:space-between;
    font-size:15px;
    font-weight:700;
    margin-top:6px;
  }
  .receipt-foot{
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    margin-top:16px;
    padding-top:12px;
    border-top:1px dashed var(--ink);
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:18px;
  }

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:#fff;
    padding:10px 18px;
    border-radius:20px;
    font-size:12.5px;
    z-index:60;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s, transform .2s;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(-6px);
  }

  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:10px;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <h1>Toko Rukun</h1>
      <span class="tag">kasir digital</span>
    </div>
    <div class="clock" id="clock">—</div>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="kasir">Kasir</button>
    <button class="tab-btn" data-tab="produk">Produk</button>
    <button class="tab-btn" data-tab="riwayat">Riwayat</button>
  </nav>

  <!-- ============ KASIR ============ -->
  <section id="tab-kasir">
    <div class="pos-grid">
      <div class="panel">
        <div class="catalog-controls">
          <input id="searchInput" class="search-input" type="text" placeholder="Cari produk…">
          <div class="chip-row" id="categoryChips"></div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </div>

      <div class="panel order-panel">
        <div class="order-head">
          <h2>Pesanan</h2>
          <button id="clearOrderBtn">kosongkan</button>
        </div>
        <div class="order-items" id="orderItems"></div>
        <div class="order-summary">
          <div class="sum-row"><span>Subtotal</span><span id="sumSubtotal">Rp 0</span></div>
          <div class="sum-row total"><span>Total</span><span id="sumTotal">Rp 0</span></div>

          <div class="cash-row">
            <label for="cashInput">Uang diterima</label>
            <input id="cashInput" type="number" min="0" placeholder="0">
            <div class="quick-cash" id="quickCash"></div>
          </div>
          <div class="sum-row" style="margin-top:10px;"><span>Kembalian</span><span id="sumChange">Rp 0</span></div>

          <button class="pay-btn" id="payBtn" disabled>Bayar &amp; Cetak Struk</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ PRODUK ============ -->
  <section id="tab-produk" class="hidden">
    <div class="produk-wrap">
      <div class="panel form-panel">
        <h2 id="formTitle">Tambah Produk</h2>
        <div class="field">
          <label for="pfName">Nama produk</label>
          <input id="pfName" type="text" placeholder="mis. Kopi Sachet">
        </div>
        <div class="field">
          <label for="pfCategory">Kategori</label>
          <input id="pfCategory" type="text" placeholder="mis. Minuman" list="catList">
          <datalist id="catList"></datalist>
        </div>
        <div class="field">
          <label for="pfPrice">Harga jual (Rp)</label>
          <input id="pfPrice" type="number" min="0" placeholder="0">
        </div>
        <div class="field">
          <label for="pfStock">Stok</label>
          <input id="pfStock" type="number" min="0" placeholder="0">
        </div>
        <div class="form-actions">
          <button class="btn-primary" id="pfSaveBtn">Simpan</button>
          <button class="btn-secondary hidden" id="pfCancelBtn">Batal</button>
        </div>
      </div>

      <div class="panel">
        <table>
          <thead>
            <tr>
              <th>Nama</th>
              <th>Kategori</th>
              <th>Harga</th>
              <th>Stok</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="productTableBody"></tbody>
        </table>
        <div id="productTableEmpty" class="empty-note hidden">Belum ada produk. Tambahkan produk pertama di form sebelah kiri.</div>
      </div>
    </div>
  </section>

  <!-- ============ RIWAYAT ============ -->
  <section id="tab-riwayat" class="hidden">
    <div class="stats-row">
      <div class="stat-card">
        <div class="label">Penjualan hari ini</div>
        <div class="value" id="statToday">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="label">Transaksi hari ini</div>
        <div class="value" id="statTodayCount">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Total penjualan tercatat</div>
        <div class="value" id="statAllTime">Rp 0</div>
      </div>
    </div>
    <div class="panel">
      <div class="history-list" id="historyList"></div>
      <div id="historyEmpty" class="empty-note hidden">Belum ada transaksi.</div>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script>
(function(){
  "use strict";

  // ---------------- State ----------------
  let products = [];
  let transactions = [];
  let cart = []; // {productId, name, price, qty}
  let activeCategory = "Semua";
  let editingProductId = null;

  const STORAGE_PRODUCTS = "kasir:products";
  const STORAGE_TX = "kasir:transactions";

  const fmt = (n) => "Rp " + Math.round(n).toLocaleString("id-ID");

  function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._h);
    toast._h = setTimeout(()=>t.classList.remove("show"), 2200);
  }

  function uid(prefix){
    return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }

  // ---------------- Persistence (database) ----------------
  async function loadData(){
    try{
      const p = await window.storage.get(STORAGE_PRODUCTS);
      products = p ? JSON.parse(p.value) : null;
    }catch(e){ products = null; }

    if(!products){
      products = seedProducts();
      await saveProducts();
    }

    try{
      const t = await window.storage.get(STORAGE_TX);
      transactions = t ? JSON.parse(t.value) : [];
    }catch(e){ transactions = []; }
  }

  async function saveProducts(){
    try{
      await window.storage.set(STORAGE_PRODUCTS, JSON.stringify(products));
    }catch(e){
      toast("Gagal menyimpan data produk");
    }
  }

  async function saveTransactions(){
    try{
      await window.storage.set(STORAGE_TX, JSON.stringify(transactions));
    }catch(e){
      toast("Gagal menyimpan data transaksi");
    }
  }

  function seedProducts(){
    return [
      {id: uid("p"), name:"Kopi Sachet", category:"Minuman", price:2500, stock:40},
      {id: uid("p"), name:"Air Mineral 600ml", category:"Minuman", price:4000, stock:60},
      {id: uid("p"), name:"Teh Botol", category:"Minuman", price:5000, stock:30},
      {id: uid("p"), name:"Mie Instan Goreng", category:"Sembako", price:3500, stock:50},
      {id: uid("p"), name:"Beras 1kg", category:"Sembako", price:14000, stock:25},
      {id: uid("p"), name:"Minyak Goreng 1L", category:"Sembako", price:18000, stock:20},
      {id: uid("p"), name:"Gula Pasir 1kg", category:"Sembako", price:15000, stock:22},
      {id: uid("p"), name:"Roti Tawar", category:"Snack", price:12000, stock:15},
      {id: uid("p"), name:"Keripik Kentang", category:"Snack", price:8000, stock:18},
      {id: uid("p"), name:"Coklat Batang", category:"Snack", price:6000, stock:24},
      {id: uid("p"), name:"Sabun Mandi", category:"Kebutuhan Rumah", price:5500, stock:35},
      {id: uid("p"), name:"Sampo Sachet", category:"Kebutuhan Rumah", price:1000, stock:80},
      {id: uid("p"), name:"Deterjen Bubuk", category:"Kebutuhan Rumah", price:9000, stock:16},
      {id: uid("p"), name:"Pulsa 10rb", category:"Lainnya", price:11000, stock:99},
      {id: uid("p"), name:"Rokok Sebungkus", category:"Lainnya", price:28000, stock:12},
    ];
  }

  // ---------------- Tabs ----------------
  function initTabs(){
    document.querySelectorAll(".tab-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        const target = btn.dataset.tab;
        ["kasir","produk","riwayat"].forEach(t=>{
          document.getElementById("tab-"+t).classList.toggle("hidden", t!==target);
        });
        if(target === "produk") renderProductTable();
        if(target === "riwayat") renderHistory();
      });
    });
  }

  // ---------------- Clock ----------------
  function tickClock(){
    const el = document.getElementById("clock");
    const now = new Date();
    const opts = {weekday:'long', day:'numeric', month:'long', year:'numeric'};
    const dateStr = now.toLocaleDateString("id-ID", opts);
    const timeStr = now.toLocaleTimeString("id-ID", {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    el.textContent = dateStr + " · " + timeStr;
  }

  // ---------------- Catalog rendering ----------------
  function getCategories(){
    const set = new Set(products.map(p=>p.category || "Lainnya"));
    return ["Semua", ...Array.from(set).sort()];
  }

  function renderChips(){
    const wrap = document.getElementById("categoryChips");
    const cats = getCategories();
    wrap.innerHTML = "";
    cats.forEach(cat=>{
      const chip = document.createElement("button");
      chip.className = "chip" + (cat===activeCategory ? " active" : "");
      chip.textContent = cat;
      chip.addEventListener("click", ()=>{
        activeCategory = cat;
        renderChips();
        renderCatalog();
      });
      wrap.appendChild(chip);
    });
  }

  function renderCatalog(){
    const grid = document.getElementById("productGrid");
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    grid.innerHTML = "";

    const filtered = products.filter(p=>{
      const matchCat = activeCategory==="Semua" || (p.category||"Lainnya")===activeCategory;
      const matchQ = !q || p.name.toLowerCase().includes(q);
      return matchCat && matchQ;
    });

    if(filtered.length===0){
      grid.innerHTML = '<div class="empty-note">Produk tidak ditemukan.</div>';
      return;
    }

    filtered.forEach(p=>{
      const card = document.createElement("button");
      card.className = "product-card" + (p.stock<=0 ? " oos" : "");
      card.disabled = p.stock<=0;
      card.innerHTML = `
        <div class="pname">${escapeHtml(p.name)}</div>
        <div class="pcat">${escapeHtml(p.category||"Lainnya")}</div>
        <div class="pprice">${fmt(p.price)}</div>
        <div class="pstock">${p.stock<=0 ? "Stok habis" : "Stok " + p.stock}</div>
      `;
      card.addEventListener("click", ()=> addToCart(p.id));
      grid.appendChild(card);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }

  // ---------------- Cart ----------------
  function addToCart(productId){
    const p = products.find(x=>x.id===productId);
    if(!p || p.stock<=0) return;
    const line = cart.find(l=>l.productId===productId);
    const inCartQty = line ? line.qty : 0;
    if(inCartQty >= p.stock){
      toast("Stok " + p.name + " tidak cukup");
      return;
    }
    if(line){
      line.qty += 1;
    }else{
      cart.push({productId:p.id, name:p.name, price:p.price, qty:1});
    }
    renderOrder();
  }

  function changeQty(productId, delta){
    const line = cart.find(l=>l.productId===productId);
    if(!line) return;
    const p = products.find(x=>x.id===productId);
    const newQty = line.qty + delta;
    if(newQty<=0){
      cart = cart.filter(l=>l.productId!==productId);
    }else if(p && newQty>p.stock){
      toast("Stok " + p.name + " tidak cukup");
      return;
    }else{
      line.qty = newQty;
    }
    renderOrder();
  }

  function removeLine(productId){
    cart = cart.filter(l=>l.productId!==productId);
    renderOrder();
  }

  function cartTotal(){
    return cart.reduce((s,l)=>s + l.price*l.qty, 0);
  }

  function renderOrder(){
    const wrap = document.getElementById("orderItems");
    wrap.innerHTML = "";
    if(cart.length===0){
      wrap.innerHTML = '<div class="order-empty">Belum ada barang dipilih.<br>Klik produk di sebelah kiri untuk menambahkan.</div>';
    }else{
      cart.forEach(l=>{
        const row = document.createElement("div");
        row.className = "order-line";
        row.innerHTML = `
          <div>
            <div class="ol-name">${escapeHtml(l.name)}</div>
            <div class="ol-unit">${fmt(l.price)} / pcs</div>
            <div class="ol-qty-row">
              <button class="qty-btn" data-act="dec">−</button>
              <span class="qty-val">${l.qty}</span>
              <button class="qty-btn" data-act="inc">+</button>
              <button class="ol-remove" data-act="rm">hapus</button>
            </div>
          </div>
          <div class="ol-linetotal">${fmt(l.price*l.qty)}</div>
        `;
        row.querySelector('[data-act="dec"]').addEventListener("click", ()=>changeQty(l.productId,-1));
        row.querySelector('[data-act="inc"]').addEventListener("click", ()=>changeQty(l.productId,1));
        row.querySelector('[data-act="rm"]').addEventListener("click", ()=>removeLine(l.productId));
        wrap.appendChild(row);
      });
    }

    const total = cartTotal();
    document.getElementById("sumSubtotal").textContent = fmt(total);
    document.getElementById("sumTotal").textContent = fmt(total);
    renderQuickCash(total);
    updateChangeAndButton();
  }

  function renderQuickCash(total){
    const wrap = document.getElementById("quickCash");
    wrap.innerHTML = "";
    if(total<=0) return;
    const rounded = Math.ceil(total/1000)*1000;
    const suggestions = Array.from(new Set([
      rounded,
      rounded+5000,
      rounded+10000,
      Math.ceil(total/50000)*50000 || 50000
    ])).filter(v=>v>0).slice(0,4).sort((a,b)=>a-b);
    suggestions.forEach(v=>{
      const btn = document.createElement("button");
      btn.textContent = fmt(v);
      btn.addEventListener("click", ()=>{
        document.getElementById("cashInput").value = v;
        updateChangeAndButton();
      });
      wrap.appendChild(btn);
    });
  }

  function updateChangeAndButton(){
    const total = cartTotal();
    const cash = parseFloat(document.getElementById("cashInput").value) || 0;
    const change = cash - total;
    document.getElementById("sumChange").textContent = fmt(Math.max(change,0));
    const payBtn = document.getElementById("payBtn");
    payBtn.disabled = !(cart.length>0 && cash>=total && total>0);
  }

  document.addEventListener("input", (e)=>{
    if(e.target.id==="cashInput") updateChangeAndButton();
    if(e.target.id==="searchInput") renderCatalog();
  });

  document.getElementById("clearOrderBtn").addEventListener("click", ()=>{
    cart = [];
    document.getElementById("cashInput").value = "";
    renderOrder();
  });

  // ---------------- Checkout ----------------
  document.getElementById("payBtn").addEventListener("click", async ()=>{
    const total = cartTotal();
    const cash = parseFloat(document.getElementById("cashInput").value) || 0;
    if(cart.length===0 || cash<total) return;

    // deduct stock
    cart.forEach(l=>{
      const p = products.find(x=>x.id===l.productId);
      if(p) p.stock = Math.max(0, p.stock - l.qty);
    });
    await saveProducts();

    const tx = {
      id: uid("tx"),
      timestamp: Date.now(),
      items: cart.map(l=>({productId:l.productId, name:l.name, price:l.price, qty:l.qty})),
      total: total,
      paid: cash,
      change: cash - total
    };
    transactions.unshift(tx);
    await saveTransactions();

    showReceipt(tx);

    cart = [];
    document.getElementById("cashInput").value = "";
    renderOrder();
    renderCatalog();
    toast("Transaksi tersimpan");
  });

  // ---------------- Receipt modal ----------------
  function showReceipt(tx){
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const dt = new Date(tx.timestamp);
    const dateStr = dt.toLocaleDateString("id-ID", {day:'numeric',month:'short',year:'numeric'});
    const timeStr = dt.toLocaleTimeString("id-ID", {hour:'2-digit',minute:'2-digit'});

    let itemsHtml = "";
    tx.items.forEach(it=>{
      itemsHtml += `
        <div style="margin-bottom:6px;">
          <div class="receipt-item-name">${escapeHtml(it.name)}</div>
          <div class="receipt-line receipt-item-sub">
            <span>${it.qty} x ${fmt(it.price)}</span>
            <span>${fmt(it.qty*it.price)}</span>
          </div>
        </div>
      `;
    });

    overlay.innerHTML = `
      <div class="receipt">
        <div class="receipt-head">
          <div class="rname">Toko Rukun</div>
          <div class="rmeta">${dateStr} · ${timeStr}</div>
          <div class="rmeta">No. ${tx.id}</div>
        </div>
        <div>${itemsHtml}</div>
        <div class="receipt-divider"></div>
        <div class="receipt-line"><span>Total</span><span></span></div>
        <div class="receipt-total-row"><span>TOTAL</span><span>${fmt(tx.total)}</span></div>
        <div class="receipt-line" style="margin-top:8px;"><span>Tunai</span><span>${fmt(tx.paid)}</span></div>
        <div class="receipt-line"><span>Kembali</span><span>${fmt(tx.change)}</span></div>
        <div class="receipt-foot">Terima kasih telah berbelanja</div>
        <div class="modal-actions">
          <button class="btn-secondary" id="closeReceiptBtn" style="flex:1;">Tutup</button>
          <button class="btn-primary" id="printReceiptBtn" style="flex:1;">Cetak</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector("#closeReceiptBtn").addEventListener("click", ()=>overlay.remove());
    overlay.querySelector("#printReceiptBtn").addEventListener("click", ()=>window.print());
    overlay.addEventListener("click",(e)=>{ if(e.target===overlay) overlay.remove(); });
  }

  // ---------------- Produk tab ----------------
  function renderProductTable(){
    const body = document.getElementById("productTableBody");
    const emptyNote = document.getElementById("productTableEmpty");
    body.innerHTML = "";

    if(products.length===0){
      emptyNote.classList.remove("hidden");
    }else{
      emptyNote.classList.add("hidden");
      products.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(p=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${escapeHtml(p.name)}</td>
          <td>${escapeHtml(p.category||"Lainnya")}</td>
          <td>${fmt(p.price)}</td>
          <td class="${p.stock<=5 ? 'stock-low' : ''}">${p.stock}</td>
          <td class="row-actions">
            <button data-act="edit">edit</button>
            <button data-act="del" class="del">hapus</button>
          </td>
        `;
        tr.querySelector('[data-act="edit"]').addEventListener("click", ()=>startEditProduct(p.id));
        tr.querySelector('[data-act="del"]').addEventListener("click", ()=>deleteProduct(p.id));
        body.appendChild(tr);
      });
    }

    // datalist for categories
    const catList = document.getElementById("catList");
    catList.innerHTML = "";
    getCategories().filter(c=>c!=="Semua").forEach(c=>{
      const opt = document.createElement("option");
      opt.value = c;
      catList.appendChild(opt);
    });
  }

  function startEditProduct(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    editingProductId = id;
    document.getElementById("formTitle").textContent = "Edit Produk";
    document.getElementById("pfName").value = p.name;
    document.getElementById("pfCategory").value = p.category||"";
    document.getElementById("pfPrice").value = p.price;
    document.getElementById("pfStock").value = p.stock;
    document.getElementById("pfCancelBtn").classList.remove("hidden");
    document.getElementById("pfSaveBtn").textContent = "Simpan Perubahan";
    window.scrollTo({top:0, behavior:"smooth"});
  }

  function resetForm(){
    editingProductId = null;
    document.getElementById("formTitle").textContent = "Tambah Produk";
    document.getElementById("pfName").value = "";
    document.getElementById("pfCategory").value = "";
    document.getElementById("pfPrice").value = "";
    document.getElementById("pfStock").value = "";
    document.getElementById("pfCancelBtn").classList.add("hidden");
    document.getElementById("pfSaveBtn").textContent = "Simpan";
  }

  document.getElementById("pfCancelBtn").addEventListener("click", resetForm);

  document.getElementById("pfSaveBtn").addEventListener("click", async ()=>{
    const name = document.getElementById("pfName").value.trim();
    const category = document.getElementById("pfCategory").value.trim() || "Lainnya";
    const price = parseFloat(document.getElementById("pfPrice").value);
    const stock = parseInt(document.getElementById("pfStock").value, 10);

    if(!name){ toast("Nama produk wajib diisi"); return; }
    if(isNaN(price) || price<0){ toast("Harga tidak valid"); return; }
    if(isNaN(stock) || stock<0){ toast("Stok tidak valid"); return; }

    if(editingProductId){
      const p = products.find(x=>x.id===editingProductId);
      if(p){ p.name=name; p.category=category; p.price=price; p.stock=stock; }
      toast("Produk diperbarui");
    }else{
      products.push({id: uid("p"), name, category, price, stock});
      toast("Produk ditambahkan");
    }
    await saveProducts();
    resetForm();
    renderProductTable();
    renderChips();
    renderCatalog();
  });

  async function deleteProduct(id){
    const p = products.find(x=>x.id===id);
    if(!p) return;
    if(!confirm('Hapus produk "'+p.name+'"?')) return;
    products = products.filter(x=>x.id!==id);
    await saveProducts();
    if(editingProductId===id) resetForm();
    renderProductTable();
    renderChips();
    renderCatalog();
  }

  // ---------------- Riwayat tab ----------------
  function isToday(ts){
    const d = new Date(ts), n = new Date();
    return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
  }

  function renderHistory(){
    const todayTx = transactions.filter(t=>isToday(t.timestamp));
    const todayTotal = todayTx.reduce((s,t)=>s+t.total,0);
    const allTotal = transactions.reduce((s,t)=>s+t.total,0);

    document.getElementById("statToday").textContent = fmt(todayTotal);
    document.getElementById("statTodayCount").textContent = todayTx.length;
    document.getElementById("statAllTime").textContent = fmt(allTotal);

    const list = document.getElementById("historyList");
    const emptyNote = document.getElementById("historyEmpty");
    list.innerHTML = "";

    if(transactions.length===0){
      emptyNote.classList.remove("hidden");
      return;
    }
    emptyNote.classList.add("hidden");

    transactions.forEach(tx=>{
      const d = new Date(tx.timestamp);
      const dateStr = d.toLocaleDateString("id-ID",{day:'numeric',month:'short'});
      const timeStr = d.toLocaleTimeString("id-ID",{hour:'2-digit',minute:'2-digit'});
      const itemsSummary = tx.items.map(it=>it.qty+"x "+it.name).join(", ");

      const row = document.createElement("div");
      row.className = "history-row";
      row.innerHTML = `
        <div class="h-time">${dateStr}<br>${timeStr}</div>
        <div>
          <div class="h-items">${escapeHtml(itemsSummary)}</div>
          <div class="h-id">${tx.id}</div>
        </div>
        <div class="h-total">${fmt(tx.total)}</div>
        <div></div>
      `;
      row.addEventListener("click", ()=>showReceipt(tx));
      list.appendChild(row);
    });
  }

  // ---------------- Init ----------------
  async function init(){
    initTabs();
    tickClock();
    setInterval(tickClock, 1000);

    await loadData();
    renderChips();
    renderCatalog();
    renderOrder();
    renderProductTable();
    renderHistory();
  }

  init();
})();
</script>
</body>
</html>
